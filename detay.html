<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Karakter Detayı - Teyvat Arşivi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0c0f12;
            --bg-card: #161b22;
            --bg-card2: #1c2128;
            --border: #30363d;
            --gold: #ffc107;
            --gold-dim: #c89b2a;
        }

        body {
            background-color: var(--bg-main);
            color: #f0f6fc;
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background-color: var(--bg-card);
            border-bottom: 2px solid var(--border);
        }

        /* ─── Hero bölümü ─── */
        .hero-section {
            position: relative;
            overflow: hidden;
            padding: 60px 0 40px;
            margin-bottom: 30px;
        }
        .hero-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 60% 50%, rgba(255,193,7,0.07) 0%, transparent 70%);
            pointer-events: none;
        }
        .char-portrait {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--gold);
            box-shadow: 0 0 40px rgba(255,193,7,0.25);
            display: block;
            margin: 0 auto;
        }

        /* ─── Tier rozeti ─── */
        .tier-badge {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 700;
            padding: 4px 18px;
            border-radius: 20px;
            color: #000;
            letter-spacing: 2px;
        }
        .tier-SS { background: #ff7f7f; }
        .tier-S  { background: #ffbf7f; }
        .tier-A  { background: #ffdf7f; }
        .tier-B  { background: #ffff7f; }
        .tier-C  { background: #bfff7f; }
        .tier-D  { background: #7fff7f; }

        /* ─── Element rozeti ─── */
        .element-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid transparent;
        }
        .el-pyro    { background: rgba(255,100,50,0.2);  border-color: #ff6432; color: #ff9070; }
        .el-hydro   { background: rgba(50,150,255,0.2);  border-color: #3296ff; color: #70b8ff; }
        .el-anemo   { background: rgba(100,200,180,0.2); border-color: #64c8b4; color: #90dcc8; }
        .el-electro { background: rgba(160,80,255,0.2);  border-color: #a050ff; color: #c890ff; }
        .el-dendro  { background: rgba(100,200,50,0.2);  border-color: #64c832; color: #90dc60; }
        .el-cryo    { background: rgba(130,200,255,0.2); border-color: #82c8ff; color: #b0dcff; }
        .el-geo     { background: rgba(200,160,50,0.2);  border-color: #c8a032; color: #dcc060; }
        .el-unknown { background: rgba(150,150,150,0.2); border-color: #969696; color: #bebebe; }

        /* ─── Yıldız ─── */
        .stars { color: var(--gold); font-size: 1.1rem; letter-spacing: 2px; }

        /* ─── Info kartları ─── */
        .info-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            height: 100%;
        }
        .info-card h5 {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--gold-dim);
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .info-card p {
            font-size: 1rem;
            color: #f0f6fc;
            margin: 0;
            font-weight: 600;
        }

        /* ─── Silah / Artifact tagları ─── */
        .tag {
            display: inline-block;
            background: var(--bg-card2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.85rem;
            color: #c9d1d9;
            margin: 4px;
        }
        .tag-weapon { border-color: #ffc107; color: #ffc107; }
        .tag-artifact { border-color: #a78bfa; color: #a78bfa; }

        /* ─── Takım tavsiyeleri ─── */
        .team-card {
            background: var(--bg-card2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 10px;
        }
        .team-card .role {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--gold-dim);
            margin-bottom: 4px;
        }

        /* ─── Geri butonu ─── */
        .btn-back {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            border-radius: 8px;
            padding: 8px 20px;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-back:hover {
            background: var(--gold);
            color: #000;
        }

        /* ─── Bölüm başlıkları ─── */
        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 16px;
        }

        footer {
            background-color: var(--bg-card);
            margin-top: 80px;
            padding: 20px 0;
            border-top: 1px solid var(--border);
        }

        .char-name-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 8px;
        }
    </style>
</head>

            <div class="col-6 col-md-3">
                <div class="info-card">
                    <h5>Rol</h5>
                    <p id="info-role">—</p>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="info-card">
                    <h5>Yıldız</h5>
                    <p id="info-rarity">—</p>
                </div>
            </div>
        </div>

        <!-- Silah tavsiyeleri -->
        <div class="mb-4">
            <p class="section-title">Önerilen Silahlar</p>
            <div id="recommended-weapons"></div>
        </div>

        <!-- Artifact tavsiyeleri -->
        <div class="mb-4">
            <p class="section-title">Önerilen Artifact Setleri</p>
            <div id="recommended-artifacts"></div>
        </div>

        <!-- Takım önerileri -->
        <div class="mb-4">
            <p class="section-title">Takım Önerileri</p>
            <div id="team-recommendations" class="row g-2"></div>
        </div>

        <!-- Benzer karakterler -->
        <div class="mb-4">
            <p class="section-title">Benzer Karakterler</p>
            <div id="similar-chars" class="d-flex flex-wrap gap-3"></div>
        </div>

    </main>

    };

    /* ─── Yardımcılar ─── */
    const elementEmoji = {
        pyro:"🔥", hydro:"💧", anemo:"🌪️", electro:"⚡", dendro:"🌿", cryo:"❄️", geo:"🪨", unknown:"✨"
    };
    const elementLabel = {
        pyro:"Pyro", hydro:"Hydro", anemo:"Anemo", electro:"Electro",
        dendro:"Dendro", cryo:"Cryo", geo:"Geo", unknown:"Bilinmiyor"
    };

    /* ─── Sayfa yüklenince ─── */
    const urlParams = new URLSearchParams(window.location.search);
    const charId    = urlParams.get('char') || 'traveler';
    const data      = characterData[charId];

    if (!data) {
        document.querySelector('main').innerHTML =
            `<div class="text-center mt-5"><h3 class="text-warning">Karakter bulunamadı.</h3>
             <a href="index.html" class="btn-back mt-3">← Listeye Geri Dön</a></div>`;
    } else {
        /* Görsel */
        const img = document.getElementById('char-image');
        img.src = `resimler/${charId}.jpg`;
        img.onerror = () => { img.src = `https://placehold.co/280x280/161b22/ffc107?text=${data.name[0]}`; };

        /* Tier badge */
        const tierBadge = document.getElementById('char-tier-badge');
        tierBadge.textContent = data.tier;
        tierBadge.className = `tier-badge tier-${data.tier}`;

        /* Element badge */
        const elBadge = document.getElementById('char-element-badge');
        elBadge.innerHTML = `${elementEmoji[data.element]} ${elementLabel[data.element]}`;
        elBadge.className = `element-badge el-${data.element}`;

        /* İsim & yıldızlar */
        document.getElementById('char-name').textContent  = data.name;
        document.getElementById('char-stars').textContent = '★'.repeat(data.stars) + '☆'.repeat(5 - data.stars);
        document.getElementById('char-desc').textContent  = data.desc;

        /* Bilgi kartları */
        document.getElementById('info-weapon').textContent = data.weaponType;
        document.getElementById('info-region').textContent = data.region;
        document.getElementById('info-role').textContent   = data.role;
        document.getElementById('info-rarity').textContent = `${data.stars} Yıldız`;

        /* Silahlar */
        const weaponBox = document.getElementById('recommended-weapons');
        data.weapons.forEach(w => {
            const span = document.createElement('span');
            span.className = 'tag tag-weapon';
            span.textContent = '⚔️ ' + w;
            weaponBox.appendChild(span);
        });

        /* Artifact */
        const artBox = document.getElementById('recommended-artifacts');
        data.artifacts.forEach(a => {
            const span = document.createElement('span');
            span.className = 'tag tag-artifact';
            span.textContent = '🔮 ' + a;
            artBox.appendChild(span);
        });

        /* Takım önerileri */
        const teamBox = document.getElementById('team-recommendations');
        data.teams.forEach((t, i) => {
            const col = document.createElement('div');
            col.className = 'col-sm-6 col-md-4';
            col.innerHTML = `<div class="team-card">
                <div class="role">Takım ${i + 1}</div>
                <div class="text-light fw-semibold">⚔️ ${t}</div>
            </div>`;
            teamBox.appendChild(col);
        });

        /* Benzer karakterler (aynı element, max 5) */
        const simBox = document.getElementById('similar-chars');
        const similar = Object.entries(characterData)
            .filter(([id, d]) => id !== charId && d.element === data.element)
            .slice(0, 5);

        similar.forEach(([id, d]) => {
            const div = document.createElement('div');
            div.style.cssText = 'width:80px;text-align:center;cursor:pointer;';
            div.innerHTML = `
                <a href="detay.html?char=${id}" style="text-decoration:none;color:inherit;">
                    <img src="resimler/${id}.jpg"
                         onerror="this.src='https://placehold.co/80x80/161b22/ffffff?text=${d.name[0]}'"
                         style="width:70px;height:70px;object-fit:cover;border-radius:50%;border:2px solid #30363d;">
                    <p style="font-size:0.7rem;margin:4px 0 0;color:#c9d1d9;">${d.name}</p>
                </a>`;
            simBox.appendChild(div);
        });
    }
    </script>
