<!DOCTYPE html>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0c0f12; color: #f0f6fc; font-family: 'Segoe UI', sans-serif; }
        .navbar { background-color: #161b22; border-bottom: 2px solid #30363d; }
        
        .tier-row {
            display: flex;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .tier-header {
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #000;
            flex-shrink: 0;
        }
        .tier-ss { background-color: #ff7f7f; }
        .tier-s  { background-color: #ffbf7f; }
        .tier-a  { background-color: #ffdf7f; }
        .tier-b  { background-color: #ffff7f; }
        .tier-c  { background-color: #bfff7f; }
        .tier-d  { background-color: #7fff7f; }

        .tier-content {
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            gap: 8px;
        }
        
        .mini-char {
            width: 70px;
            text-align: center;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .mini-char img { width: 100%; height: 70px; object-fit: cover; }
        .mini-char p { margin: 0; padding: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-char a { text-decoration: none; color: white; }
    </style>
</head>
