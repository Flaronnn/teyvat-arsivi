<!DOCTYPE html>

    <title>Karakterler - Teyvat Arşivi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: #0c0f12;
            color: #f0f6fc; 
            font-family: 'Segoe UI', sans-serif;
        }
        .navbar { background-color: #161b22; border-bottom: 2px solid #30363d; }
        
        .char-card { 
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: all 0.2s ease-in-out;
        }
        .char-card:hover {
            transform: translateY(-5px);
            border-color: #ffc107;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        
        .rarity-5 { background: linear-gradient(180deg, #161b22 60%, #bc7a20 100%); }
        .rarity-4 { background: linear-gradient(180deg, #161b22 60%, #7d519d 100%); }

        .img-container {
            position: relative;
            width: 100%;
            height: 140px;
            background: #21262d;
        }
        .char-card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .element-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.75);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card-link { text-decoration: none; color: white; }
        .stars { color: #ffc107; font-size: 0.75rem; }
        .filter-panel { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; }
    </style>
</head>

        // Ekrana Basma Fonksiyonu
        function displayCharacters(data) {
            const grid = document.getElementById('character-grid');
            grid.innerHTML = "";
            
            document.getElementById('char-count').innerText = `${data.length} Karakter`;

            if(data.length === 0) {
                grid.innerHTML = `<div class="col-12 text-center my-5 text-muted">Aranan kriterlere uygun karakter bulunamadı.</div>`;
                return;
            }

            data.forEach(char => {
                const starsHtml = "★".repeat(char.rarity);
                grid.innerHTML += `
                    <div class="col">
                        <div class="char-card rarity-${char.rarity} h-100">
                            <div class="img-container">
                                <span class="element-badge text-warning fw-semibold">${char.element}</span>
                                <a href="detay.html?char=${char.id}">
                                    <img src="resimler/${char.id}.jpg" onerror="this.src='https://placehold.co/300x250/161b22/ffffff?text=${char.name}'" alt="${char.name}">
                                </a>
                            </div>
                            <div class="p-2 text-center text-white">
                                <h6 class="fw-bold mb-1 text-truncate">
                                    <a href="detay.html?char=${char.id}" class="card-link">${char.name}</a>
                                </h6>
                                <div class="stars mb-1">${starsHtml}</div>
                                <div class="text-muted small">${char.weapon} / ${char.role}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Akıllı Kombine Filtreleme Motoru
        function applyFilters() {
            const elementValue = document.getElementById('elementFilter').value;
            const weaponValue = document.getElementById('weaponFilter').value;

            let filteredData = characters;

            if (elementValue !== 'ALL') {
                filteredData = filteredData.filter(c => c.element === elementValue);
            }

            if (weaponValue !== 'ALL') {
                filteredData = filteredData.filter(c => c.weapon === weaponValue);
            }

            displayCharacters(filteredData);
        }

        // Sayfa açılışında listeyi yükle
        displayCharacters(characters);
